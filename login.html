<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GymFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/index.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, rgba(99, 91, 255, 0.12), transparent 45%), #f6f7fb;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid var(--gf-border);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(38, 42, 77, 0.09);
            text-align: center;
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 24px;
            text-decoration: none;
            color: var(--gf-text);
        }

        .login-field {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
            margin-bottom: 16px;
        }

        .login-field label {
            font-size: 12px;
            font-weight: 700;
            color: #4b5168;
        }

        .login-field input {
            height: 46px;
            padding: 0 16px;
            border: 1px solid #dcdfe8;
            border-radius: 12px;
            background: #f8f9fc;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .login-field input:focus {
            background: #ffffff;
            border-color: rgba(99, 91, 255, 0.6);
            box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.12);
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
            min-height: 16px;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--gf-primary), var(--gf-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(99, 91, 255, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(99, 91, 255, 0.35);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <a class="login-logo" href="#">
            <div class="brand-mark">G</div>
            <span>Gym<span style="color: var(--gf-primary);">Flow</span></span>
        </a>
        <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 6px; color: var(--gf-text);">Admin Login</h2>
        <p style="color: var(--gf-muted); font-size: 13px; margin-bottom: 24px;">Enter your credentials to access the gym dashboard.</p>
        <div class="login-field">
            <label>Username</label>
            <input type="text" id="username" placeholder="admin" autofocus>
            <div id="usernameError" class="error-message"></div>
        </div>
        <div class="login-field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
            <div id="passwordError" class="error-message"></div>
        </div>
        <button id="login" class="login-btn" type="button">Sign In to GymFlow</button>
    </div>


    <script>
        const username = document.getElementById("username");
        const password = document.getElementById("password");
        const login = document.getElementById("login");

        const usernameError = document.getElementById("usernameError");
        const passwordError = document.getElementById("passwordError");

        function handleLogin() {
            usernameError.textContent = "";
            passwordError.textContent = "";

            if (username.value.trim() !== "admin") {
                usernameError.textContent = "Incorrect username. Please enter the correct username.";
                alert("Hint: Username is admin");
                username.value = "";
                username.focus();
                return;
            }

            if (password.value.trim() !== "123") {
                passwordError.textContent = "Incorrect password. Please enter the password again.";
                alert("Hint: Password is 123");
                password.value = "";
                password.focus();
                return;
            }

            localStorage.setItem("authStatus", "true");
            window.location.href = "index.html";
        }

        if (login) {
            login.addEventListener("click", handleLogin);
        }
        
        if (password) {
            password.addEventListener("keyup", (e) => {
                if (e.key === "Enter") {
                    handleLogin();
                }
            });
        }
    </script>
</body>
</html>
