<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Settings - GymFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/gymManage.css">
</head>
<body>
    <!-- TOP NAVBAR -->
    <nav class="gf-navbar">
        <div class="gf-navbar-inner">
            <a class="gf-brand" href="index.html">
                <div class="brand-mark">G</div>
                <span>Gym<span>Flow</span></span>
            </a>
            
            <div class="gf-nav-right">
                <div class="gf-nav-links">
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </a>
                    <a href="members.html">
                        <i class="fa-solid fa-user-group"></i>
                        <span>Members</span>
                    </a>
                    <a href="transaction.html">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                        <span>Transactions</span>
                    </a>
                </div>

                <div class="gf-nav-divider"></div>

                <div class="dropdown gf-profile-dropdown">
                    <button class="gf-profile-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="profile-avatar">B</div>
                        <span class="profile-name">Admin</span>
                    </button>
                    <ul class="dropdown-menu gf-dropdown dropdown-menu-end">
                        <li><a class="dropdown-item" href="profile.html"><i class="fa-regular fa-user me-2"></i> Profile</a></li>
                        <li><a class="dropdown-item" href="gymManage.html"><i class="fa-solid fa-gear me-2"></i> Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item logout-item" href="login.html"><i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- PAGE CONTAINER -->
    <div class="dashboard-page" style="padding: 28px 32px 60px; max-width: 1440px; margin: auto;">
        
        <!-- HERO STRIP -->
        <div class="page-hero">
            <div class="hero-left">
                <div class="page-eyebrow">
                    <span class="eyebrow-dot"></span>
                    GYMFLOW / SETTINGS
                </div>
                <h1>Gym Settings</h1>
                <p>Configure gym operating details, membership pricing rules and general preferences.</p>
            </div>

            <div class="header-decoration">
                <div class="floating-orb orb-one"></div>
                <div class="floating-orb orb-two"></div>
                <div class="header-stat">
                    <span>PREFERENCES</span>
                    <strong>GYM<span>FLOW</span></strong>
                </div>
            </div>
        </div>

        <!-- SETTINGS GRID -->
        <div class="settings-grid">
            <div class="settings-card">
                <div>
                    <div class="settings-card-header">
                        <div class="settings-icon-badge"><i class="fa-solid fa-dumbbell"></i></div>
                        <h3>Gym Profile & Location</h3>
                    </div>

                    <div class="settings-form">
                        <div class="settings-field">
                            <label>Gym / Facility Name</label>
                            <input type="text" value="GymFlow Elite Fitness">
                        </div>
                        <div class="settings-field">
                            <label>Contact Phone</label>
                            <input type="tel" value="+91 8525001313">
                        </div>
                        <div class="settings-field">
                            <label>Address / City</label>
                            <input type="text" value="New Delhi, India">
                        </div>
                    </div>
                </div>

                <div class="settings-footer">
                    <button class="save-member-btn" type="button" onclick="alert('Gym profile updated successfully!')">
                        <span>Save Facility Details</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <div class="settings-card">
                <div>
                    <div class="settings-card-header">
                        <div class="settings-icon-badge"><i class="fa-solid fa-sliders"></i></div>
                        <h3>Default Pricing Plans</h3>
                    </div>

                    <div class="settings-form">
                        <div class="settings-field">
                            <label>1 Month Plan (₹)</label>
                            <input type="number" value="1500">
                        </div>
                        <div class="settings-field">
                            <label>3 Month Plan (₹)</label>
                            <input type="number" value="3500">
                        </div>
                        <div class="settings-field">
                            <label>1 Year Plan (₹)</label>
                            <input type="number" value="9000">
                        </div>
                    </div>
                </div>

                <div class="settings-footer">
                    <button class="save-member-btn" type="button" onclick="alert('Pricing plans updated successfully!')">
                        <span>Save Pricing Rules</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const logoutElements = document.querySelectorAll(".logout-item");
            logoutElements.forEach(el => {
                el.addEventListener("click", (e) => {
                    e.preventDefault();
                    localStorage.setItem("authStatus", "false");
                    window.location.href = "login.html";
                });
            });
        });
    </script>
</body>
</html>
